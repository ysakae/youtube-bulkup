# YouTube Bulk Uploader Configuration

# Authentication settings
auth:
  client_secrets_file: "client_secrets.json"
  token_file: "token.pickle"
  scopes:
    - "https://www.googleapis.com/auth/youtube"

# Upload settings
upload:
  # Chunk size in bytes (multiple of 256KB). 1024 * 1024 * 4 = 4MB
  chunk_size: 4194304
  retry_count: 5
  privacy_status: "private"  # private, public, unlisted
  daily_quota_limit: 10000   # YouTube API daily quota limit (units)

# Quota settings
quota:
  # YouTube Data API の日次クォータ上限 (ユニット)。
  #
  # この値は「アップロード履歴からの実測に基づく暫定値」である。
  # 根拠: 2026-07-15 に 104 本アップロードした実績があり、
  #       videos.insert は 1 本 1,600 units なので 166,400 units を
  #       消費できたことになる。つまり実際の割当は最低でもこの値。
  #       200,000 はそれを少し上回る保守的な設定。
  #
  # 正確な値は GCP コンソールで確認できる:
  #   「IAM と管理」→「割り当て」→ フィルタに YouTube Data API v3
  #   →「Queries per day」の【現在の上限】を見る
  #     (「デフォルト: 10,000」という表示は引き上げ前の既定値であって
  #      現在の割当ではない点に注意)
  # 確認できたら、その実値に書き換えること。詳細は docs/QUOTA_INCREASE.md。
  #
  # この値が実際より小さい場合: playlist orphans --fix / dedupe --fix の
  #   1 回あたりの処理件数が少なくなるだけで、動作自体は安全。
  # この値が実際より大きい場合: 403 quotaExceeded を受け取るまで走るが、
  #   その時点で自動的に中断し残件を報告するので、こちらも安全側に倒れる。
  #
  # 下の upload.daily_quota_limit と大きい方が採用される。
  daily_limit: 200000
  # 予備として残すユニット。
  # 根拠: orphans / dedupe は判定のために毎回全走査を行い、
  # 動画一覧 + 全プレイリストの中身 + プレイリスト一覧で
  # 1回あたり約 1,000 ユニットを消費する (動画 10,000 本 /
  # プレイリスト 550 個規模の場合)。この読み取り分を書き込みの
  # 予算から除いておくため。
  reserve: 1000

# Cache settings (YouTube 側の状態のローカルキャッシュ)
cache:
  enabled: true
  ttl_hours: 24
  path: "youtube_cache.db"

# Database path
history_db: "upload_history.db"

# Metadata templates
# 利用可能な変数: {folder}, {stem}, {filename}, {date}, {year}, {index}, {total}
# フォルダに .yt-meta.yaml を置くとフォルダ別にオーバーライド可能
metadata:
  title_template: "【{folder}】{stem}"
  description_template: |
    {folder}
    No. {index}/{total}

    File: {filename}
    Captured: {date}
  tags:
    - "auto-upload"
